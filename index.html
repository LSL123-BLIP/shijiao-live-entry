<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% -10%, #1e2b3a 0%, #0c0e14 60%, #080a0e 100%);
    color: #eef2f6; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  /* 舞台光 */
  body::before, body::after {
    content: ""; position: fixed; top: -20%; width: 46vw; height: 140vh;
    filter: blur(70px); opacity: .35; z-index: 0; pointer-events: none;
  }
  body::before { left: -8%; background: radial-gradient(circle, #34d399 0%, transparent 70%); transform: rotate(18deg); }
  body::after  { right: -8%; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); transform: rotate(-18deg); }

  h1 { font-size: 34px; margin: 0 0 10px; letter-spacing: 1px; }
  .tag { font-size: 15px; color: #9fb0c3; margin: 0 0 22px; }
  .sub { color: #c3cedb; font-size: 16px; line-height: 1.8; margin: 0 0 32px; }

  .btn {
    display: inline-block; padding: 16px 46px; border-radius: 14px;
    background: linear-gradient(135deg, #34d399, #10b981);
    color: #06231a; font-size: 18px; font-weight: 700; text-decoration: none;
    box-shadow: 0 14px 34px rgba(16, 185, 129, .4);
  }
  .btn:active { transform: translateY(1px); }
  .url { font-size: 13px; color: #7d8a99; margin-top: 24px; word-break: break-all; }
  .tip { font-size: 12px; color: #5d6b7a; margin-top: 30px; line-height: 1.9; }

</head>
